server.port=8080
logging.level.id.ac.polinema.lumajang=DEBUG
app.pesan-sambutan=Mode pengembangan - data masih tersimpan di memori

spring.datasource.url=jdbc:postgresql://localhost:5432/portalku_db
spring.datasource.username=postgres
spring.datasource.password=12341234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=skema awal website PSDKU